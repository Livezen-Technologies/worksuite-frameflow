# Deploys the FrameFlow web editor to Cloudflare Workers (OpenNext) at
# https://frameflow.worksuitecloud.com. Run it from Actions → Deploy web.
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit, Workers Routes:Edit and
#                          Zone DNS:Edit on worksuitecloud.com
#   CLOUDFLARE_ACCOUNT_ID
#   DATABASE_URL, BETTER_AUTH_SECRET, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN,
#   MARBLE_WORKSPACE_KEY, FREESOUND_CLIENT_ID, FREESOUND_API_KEY
# Repository variables (optional):
#   NEXT_PUBLIC_MARBLE_API_URL (default https://api.marblecms.com),
#   NEXT_PUBLIC_WSC_ASSET_URL  (the Asset Library feed, default https://frameflow.worksuitecloud.com/library)
name: Deploy web

on:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://frameflow.worksuitecloud.com
      NEXT_PUBLIC_MARBLE_API_URL: ${{ vars.NEXT_PUBLIC_MARBLE_API_URL || 'https://api.marblecms.com' }}
      NEXT_PUBLIC_WSC_ASSET_URL: ${{ vars.NEXT_PUBLIC_WSC_ASSET_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      MARBLE_WORKSPACE_KEY: ${{ secrets.MARBLE_WORKSPACE_KEY }}
      FREESOUND_CLIENT_ID: ${{ secrets.FREESOUND_CLIENT_ID }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL BETTER_AUTH_SECRET UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN MARBLE_WORKSPACE_KEY FREESOUND_CLIENT_ID FREESOUND_API_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build WASM
        run: wasm-pack build rust/wasm --target bundler --out-dir pkg

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        run: bun install

      - name: Build and deploy
        working-directory: apps/web
        run: bun run deploy

      - name: Set Worker runtime secrets
        working-directory: apps/web
        run: |
          node -e 'const k=["DATABASE_URL","BETTER_AUTH_SECRET","UPSTASH_REDIS_REST_URL","UPSTASH_REDIS_REST_TOKEN","MARBLE_WORKSPACE_KEY","FREESOUND_CLIENT_ID","FREESOUND_API_KEY"];process.stdout.write(JSON.stringify(Object.fromEntries(k.map(n=>[n,process.env[n]]))))' > "$RUNNER_TEMP/secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://frameflow.worksuitecloud.com/) && [ "$code" = 200 ] && echo "Live: HTTP $code" && exit 0
            echo "Waiting for the domain (HTTP $code)…"; sleep 20
          done
          echo "::error::https://frameflow.worksuitecloud.com/ didn't answer 200"; exit 1
