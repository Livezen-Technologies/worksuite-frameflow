name: Library feed check
on:
  workflow_dispatch:
    inputs:
      base:
        default: x
      channel:
        default: stable
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/assets/dump-feed.cjs || true
      - run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add -f diag/out.txt; git commit -m "diag output"; git push origin HEAD:diag/library-feed
