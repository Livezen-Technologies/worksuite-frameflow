name: Local models

# Mirrors the on-device models (Whisper, Real-ESRGAN, RIFE) to the download
# center so the app downloads them from there:
#   s3://$DOWNLOAD_CENTER_BUCKET/models/<id>.onnx
#   s3://$DOWNLOAD_CENTER_BUCKET/models/hf/<repo>/resolve/main/...
# Run it from Actions → Local models. Without the download center secrets it
# only checks every source answers and keeps manifest.json as an artifact.
on:
  workflow_dispatch:
  push:
    tags:
      - "models-v*"

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      DOWNLOAD_CENTER_BUCKET: ${{ secrets.DOWNLOAD_CENTER_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download every model from its source
        run: node scripts/models/publish.mjs --out dist/models

      - uses: actions/upload-artifact@v4
        with:
          name: models-manifest
          path: dist/models/manifest.json

      - name: Publish to the download center
        if: env.DOWNLOAD_CENTER_BUCKET != ''
        env:
          DOWNLOAD_CENTER_ENDPOINT: ${{ secrets.DOWNLOAD_CENTER_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOAD_CENTER_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOAD_CENTER_SECRET }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp dist/models/ "s3://$DOWNLOAD_CENTER_BUCKET/models/" --recursive \
            --exclude manifest.json --cache-control "public, max-age=31536000, immutable" \
            --endpoint-url "$DOWNLOAD_CENTER_ENDPOINT"
          aws s3 cp dist/models/manifest.json "s3://$DOWNLOAD_CENTER_BUCKET/models/manifest.json" \
            --cache-control "no-cache" --content-type application/json --endpoint-url "$DOWNLOAD_CENTER_ENDPOINT"

      - name: Skip publishing
        if: env.DOWNLOAD_CENTER_BUCKET == ''
        run: echo "::warning::Download center secrets aren't set; models were checked but not uploaded."
