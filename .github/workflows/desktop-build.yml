name: Desktop Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: dist:mac
          - name: Windows
            os: windows-latest
            target: dist:win
          - name: Linux
            os: ubuntu-latest
            target: dist:linux

    # Build-time placeholders only: the web app validates these at build.
    # The desktop app runs fully offline; see electron/main.js.
    env:
      # Set only when the download center secrets exist (gates the publish step).
      DOWNLOAD_CENTER_BUCKET: ${{ secrets.DOWNLOAD_CENTER_BUCKET }}
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
      BETTER_AUTH_SECRET: "build-only-placeholder-secret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://placeholder.example.com"
      UPSTASH_REDIS_REST_TOKEN: "placeholder"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"
      # No Livezen certificates yet: macOS builds are ad-hoc signed
      # (electron/package.json "identity": "-"), Windows builds are unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.116

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}

      - name: Test the effects engine
        if: runner.os == 'Linux'
        run: cargo test -p effects

      - name: Build the engine (opencut-wasm)
        shell: bash
        run: ./scripts/build-wasm.sh

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install

      - name: Build web app
        working-directory: apps/web
        run: bun run build

      - name: Install desktop dependencies
        working-directory: electron
        run: npm install

      - name: Bundle web server into desktop app
        working-directory: electron
        run: npm run prepare-web

      - name: Package installers
        working-directory: electron
        run: npm run ${{ matrix.target }}

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        working-directory: electron
        run: |
          for app in dist/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Worksuite-FrameFlow-${{ matrix.name }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.zip
            electron/dist/*.blockmap
            electron/dist/latest*.yml
          if-no-files-found: error

      # The download center serves installers and the latest*.yml feeds the
      # app's auto-updater reads: <bucket>/frameflow/<channel>/. Tags with
      # "-beta" go to the beta channel. Skipped until the secrets are set.
      - name: Publish to the download center
        if: startsWith(github.ref, 'refs/tags/v') && env.DOWNLOAD_CENTER_BUCKET != ''
        env:
          DOWNLOAD_CENTER_ENDPOINT: ${{ secrets.DOWNLOAD_CENTER_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOAD_CENTER_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOAD_CENTER_SECRET }}
          AWS_DEFAULT_REGION: auto
        shell: bash
        run: |
          channel=stable
          [[ "$GITHUB_REF_NAME" == *-beta* ]] && channel=beta
          # Installers first, feeds last, so the feed never points at a missing file.
          aws s3 cp electron/dist/ "s3://$DOWNLOAD_CENTER_BUCKET/frameflow/$channel/" --recursive \
            --exclude "*" --include "*.dmg" --include "*.zip" --include "*.exe" --include "*.AppImage" \
            --include "*.deb" --include "*.blockmap" --endpoint-url "$DOWNLOAD_CENTER_ENDPOINT"
          aws s3 cp electron/dist/ "s3://$DOWNLOAD_CENTER_BUCKET/frameflow/$channel/" --recursive \
            --exclude "*" --include "latest*.yml" --cache-control "no-cache" --endpoint-url "$DOWNLOAD_CENTER_ENDPOINT"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.zip
            electron/dist/*.blockmap
            electron/dist/latest*.yml
