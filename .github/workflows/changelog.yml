name: Changelog

on:
  pull_request:

jobs:
  changelog-updated:
    name: CHANGELOG.md updated
    runs-on: ubuntu-latest
    # Add the "skip-changelog" label for changes with nothing user-facing.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
          else
            echo "::error file=CHANGELOG.md::Add a line under ## [Unreleased] describing this change (or label the PR skip-changelog)."
            exit 1
          fi
