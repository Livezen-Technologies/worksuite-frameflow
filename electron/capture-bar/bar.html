<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
<style>
  html, body { margin: 0; background: transparent; font: 13px system-ui, sans-serif; color: #fff; user-select: none; }
  .bar { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px; border-radius: 22px;
         background: rgba(20, 24, 33, 0.94); border: 1px solid rgba(255,255,255,0.12); -webkit-app-region: drag; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
  .paused .dot { background: #f59e0b; }
  .time { font-variant-numeric: tabular-nums; min-width: 56px; }
  button { -webkit-app-region: no-drag; border: 0; border-radius: 14px; height: 28px; padding: 0 10px; cursor: pointer;
           background: rgba(255,255,255,0.1); color: #fff; font: inherit; }
  button:hover { background: rgba(255,255,255,0.2); }
  button.stop { background: #ef4444; }
  button.on { background: #2563eb; }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <span class="dot"></span>
    <span class="time" id="time">0:00</span>
    <button id="pause" title="Pause or resume">Pause</button>
    <button id="marker" title="Add a marker">Marker</button>
    <button id="mic" title="Mute or unmute the microphone">Mic on</button>
    <button id="camera" title="Turn the camera on or off" hidden>Cam on</button>
    <button id="pen" title="Draw on the screen (Esc to stop)">Pen</button>
    <button id="clear" title="Clear the drawing" hidden>Clear</button>
    <button id="discard" title="Throw this take away">Discard</button>
    <button id="stop" class="stop" title="Stop and add to the timeline">Stop</button>
  </div>
  <script src="bar.js"></script>
</body>
</html>
