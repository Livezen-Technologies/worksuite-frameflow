<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; cursor: crosshair; }
  canvas { position: fixed; inset: 0; }
  .colors { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 8px;
            padding: 6px 10px; border-radius: 18px; background: rgba(20,24,33,0.9); }
  .colors button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .colors button.on { border-color: #fff; }
</style>
</head>
<body>
  <canvas id="ink"></canvas>
  <div class="colors" id="colors"></div>
  <script src="pen.js"></script>
</body>
</html>
